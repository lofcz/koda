name: Release and Publish to npm
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
concurrency:
  group: npm-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Firefox and WebKit run beside the release job; it publishes only if both pass.
  browsers:
    if: github.repository == 'lofcz/react-image-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      # Firefox and WebKit need system libraries the hosted image does not ship.
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - run: pnpm run test:browser:${{ matrix.browser }}
        timeout-minutes: 20
  release:
    needs: browsers
    if: github.repository == 'lofcz/react-image-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0 pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      # GitHub's hosted image already supplies Chromium's shared libraries.
      - run: pnpm exec playwright install --only-shell chromium
        timeout-minutes: 5
      - run: pnpm run test:browser
        timeout-minutes: 10
      - run: pnpm run test:a11y
        timeout-minutes: 10
      - name: Bump and commit release
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -am "chore: release v$version"
          git tag "v$version"
      - name: Publish with trusted publishing
        run: npm publish --provenance --access public
      - run: git push --follow-tags origin HEAD:main && git push origin "v${{ steps.release.outputs.version }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes
