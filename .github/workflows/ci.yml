name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supported: Node 24 (engines allow 22+) and React 19.
jobs:
  ci:
    name: Node 24, React 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The demo is a workspace package, so the root install covers it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:coverage
      - run: pnpm run test:package
      - run: pnpm --dir demo run typecheck
      - run: pnpm --dir demo run build
      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # Hosted runners include Chromium's shared libraries.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm run test:browser
